<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Franchini Pilates</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<header class="hero">

    <div class="overlay"></div>

    <nav class="navbar">
        <ul>
            <li><a th:href="@{/}">Home</a></li>
            <li><a href="#sobre">Sobre</a></li>
            <li><a href="#estrutura">Estrutura</a></li>
            <li><a href="#servicos">Serviços</a></li>
            <li><a href="#contato">Contato</a></li>
            <li><a th:href="@{/login}">Login</a></li>
        </ul>
    </nav>

    <div class="hero-content">

        <img th:src="@{/img/logo.png}"
             class="hero-logo"
             alt="Studio Franchini">

        <a href="#contato" class="btn">
            WhathsApp
        </a>

    </div>

</header>

<section id="sobre">
    <div class="content">
        <h2>Sobre</h2>
        <p>Conte aqui a história do Studio Franchini.</p>
    </div>
</section>

<section id="estrutura">
    <div class="content">
        <h2>Estrutura</h2>
        <p>Fotos e descrição da estrutura.</p>
    </div>
</section>

<section id="servicos">
    <div class="content">
        <h2>Serviços</h2>
        <p>Pilates • Reabilitação • Condicionamento.</p>
    </div>
</section>

<section id="contato">
    <div class="content">
        <h2>Contato</h2>
        <p>WhatsApp, endereço e redes sociais.</p>
    </div>
</section>

</body>
</html>
